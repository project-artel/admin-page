server {
    # orchestration 과 agent 가 8080을 쓰는 것에 맞춘다.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # /assets/ 아래는 파일 이름에 해시가 붙으므로 오래 캐시해도 안전하다.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html 은 그 해시 이름을 담고 있어, 캐시하면 새 배포가 브라우저에 닿지 않는다.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA 라 라우팅은 브라우저가 한다.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
